<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img"
     aria-label="StructUrb+ — dimensionnement de chaussée urbaine et bilan carbone à 50 ans">
  <title>StructUrb+</title>
  <defs>
    <pattern id="s-bit" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#2B2D2F"/>
      <circle cx="1.5" cy="1.5" r=".7" fill="#4a4d50"/><circle cx="4.5" cy="4" r=".6" fill="#43464a"/>
    </pattern>
    <pattern id="s-bit2" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#232527"/>
      <circle cx="2" cy="2" r=".75" fill="#3d4043"/><circle cx="4.8" cy="4.6" r=".6" fill="#383b3e"/>
    </pattern>
    <pattern id="s-gnt" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#9C9384"/>
      <circle cx="2" cy="2.5" r="1.5" fill="#87806f"/><circle cx="6.5" cy="6" r="1.8" fill="#aaa192"/>
      <circle cx="7" cy="1.5" r="1" fill="#7d7566"/>
    </pattern>
    <pattern id="s-sol" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#E6E8E3"/>
      <path d="M-1 7 L7 -1 M1 9 L9 1" stroke="#B4BAB3" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#E6E8E3"/>

  <!-- marque -->
  <g transform="translate(96 84)">
    <rect x="0" y="0"  width="54" height="10" fill="#14171A"/>
    <rect x="0" y="14" width="54" height="13" fill="#9C9384"/>
    <rect x="0" y="31" width="54" height="15" fill="#C3C8C0"/>
    <path d="M0 51h54" stroke="#14171A" stroke-width="2.6" stroke-dasharray="5 5"/>
  </g>

  <text x="96" y="184" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="500"
        letter-spacing="3.6" fill="#8D948B">CATALOGUE DES STRUCTURES TYPES</text>
  <text x="94" y="272" font-family="Archivo, Helvetica, sans-serif" font-size="96" font-weight="800"
        letter-spacing="-2.8" fill="#14171A">StructUrb<tspan fill="#E0A80B">+</tspan></text>
  <text x="96" y="322" font-family="Archivo, Helvetica, sans-serif" font-size="28"
        fill="#5E655D">Dimensionnement de chaussée urbaine</text>
  <text x="96" y="358" font-family="Archivo, Helvetica, sans-serif" font-size="28"
        fill="#5E655D">et bilan carbone à 50 ans</text>
  <text x="96" y="404" font-family="IBM Plex Mono, monospace" font-size="14" fill="#8D948B"
        >Application web autonome · d'après Struct-Urb (CERTU / Cerema) · GPL-3.0</text>

  <!-- Coupe filant sur toute la largeur. Épaisseurs à l'échelle : 4,4 px par cm. -->
  <g>
    <rect x="0" y="440" width="1280" height="26"  fill="url(#s-bit)"/>
    <rect x="0" y="466" width="1280" height="44"  fill="url(#s-bit2)"/>
    <rect x="0" y="510" width="1280" height="88"  fill="url(#s-gnt)"/>
    <rect x="0" y="598" width="1280" height="42"  fill="url(#s-sol)"/>
    <path d="M0 466h1280M0 510h1280M0 598h1280" stroke="#14171A" stroke-width="1.1" stroke-opacity=".5"/>
    <path d="M0 440.8h1280" stroke="#14171A" stroke-width="1.8"/>

    <g font-family="IBM Plex Mono, monospace" font-size="12">
      <g stroke="#E6E8E3">
        <path d="M98 440v70" stroke-width="1" stroke-opacity=".6"/>
        <path d="M91 440h14M91 484h14" stroke-width="1.2" stroke-opacity=".85"/>
        <path d="M94 462h8M94 506h8" stroke-width="1" stroke-opacity=".45"/>
      </g>
      <g stroke="#14171A">
        <path d="M98 510v88" stroke-width="1" stroke-opacity=".45"/>
        <path d="M91 528h14M91 572h14" stroke-width="1.2" stroke-opacity=".75"/>
        <path d="M94 550h8M94 594h8" stroke-width="1" stroke-opacity=".35"/>
      </g>
      <text x="114" y="454" fill="#E6E8E3">0</text>
      <text x="114" y="498" fill="#E6E8E3">10</text>
      <text x="114" y="542" fill="#14171A">20</text>
      <text x="114" y="586" fill="#14171A">30</text>
      <text x="114" y="624" font-size="11" letter-spacing="1.4" fill="#5E655D">CM</text>
    </g>

    <g text-anchor="end" font-family="Archivo, Helvetica, sans-serif" font-size="15" font-weight="600">
      <text x="1190" y="459" fill="#E6E8E3">BBSG<tspan font-family="IBM Plex Mono, monospace"
            font-weight="400" fill="#B4BAB3" dx="8">6 cm</tspan></text>
      <text x="1190" y="494" fill="#E6E8E3">GB3<tspan font-family="IBM Plex Mono, monospace"
            font-weight="400" fill="#B4BAB3" dx="8">10 cm</tspan></text>
      <text x="1190" y="560" fill="#14171A">GNT<tspan font-family="IBM Plex Mono, monospace"
            font-weight="400" fill="#2B2D2F" dx="8">20 cm</tspan></text>
      <text x="1190" y="624" font-family="IBM Plex Mono, monospace" font-size="12"
            font-weight="400" fill="#5E655D">PF2</text>
    </g>
  </g>
</svg>
